<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - YourApp</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --text-secondary: #94a3b8;
  --accent: #3b82f6;
  --border: #334155;
  --error: #ef4444;
  --success: #10b981;
}
body.light {
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --text-secondary: #64748b;
  --border: #e2e8f0;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body {
  background: var(--bg);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px; transition: all 0.3s ease;
}

/* Background gradient animation */
body::before {
  content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  opacity: 0.1; z-index: -1;
}

.auth-container {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 40px; border-radius: 20px; max-width: 420px; width: 100%;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}

.header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
}
.logo { font-size: 28px; font-weight: 700; color: var(--accent); }
.theme-btn {
  background: none; border: 2px solid var(--border); padding: 8px 12px;
  border-radius: 8px; cursor: pointer; font-size: 18px; color: var(--text);
}

.tabs {
  display: flex; background: var(--bg); border-radius: 12px; padding: 4px; margin-bottom: 30px;
}
.tab {
  flex: 1; padding: 12px; border: none; background: none; color: var(--text-secondary);
  font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.3s;
}
.tab.active { background: var(--accent); color: white; }

.form { display: none; }
.form.active { display: block; }

.form-group { margin-bottom: 20px; position: relative; }
.form-group label {
  display: block; margin-bottom: 8px; color: var(--text); font-weight: 500; font-size: 14px;
}
.form-group input {
  width: 100%; padding: 14px 16px; background: var(--bg); border: 2px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 16px; outline: none;
  transition: all 0.3s;
}
.form-group input:focus { border-color: var(--accent); }
.form-group input.error { border-color: var(--error); }
.form-group input.success { border-color: var(--success); }

.error-msg {
  color: var(--error); font-size: 13px; margin-top: 6px; display: none;
}
.error-msg.show { display: block; }

.password-wrapper { position: relative; }
.toggle-pass {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--text-secondary);
  font-size: 18px; padding: 4px;
}

.password-strength {
  height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden;
}
.strength-bar {
  height: 100%; width: 0%; transition: all 0.3s; border-radius: 2px;
}
.strength-weak { background: var(--error); width: 33%; }
.strength-medium { background: #f59e0b; width: 66%; }
.strength-strong { background: var(--success); width: 100%; }

.options {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 25px; font-size: 14px;
}
.checkbox-group { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
.checkbox-group input { width: auto; cursor: pointer; }
.forgot { color: var(--accent); text-decoration: none; }
.forgot:hover { text-decoration: underline; }

.btn {
  width: 100%; padding: 15px; background: var(--accent); color: white; border: none;
  border-radius: 10px; font-weight: 600; font-size: 16px; cursor: pointer;
  transition: all 0.3s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(59,130,246,0.3); }
.btn:disabled { background: var(--text-secondary); cursor: not-allowed; transform: none; }

.divider {
  display: flex; align-items: center; margin: 25px 0; color: var(--text-secondary); font-size: 14px;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.divider span { padding: 0 15px; }

.social-btns { display: flex; gap: 12px; }
.social-btn {
  flex: 1; padding: 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; cursor: pointer; font-size: 20px; transition: all 0.3s;
}
.social-btn:hover { border-color: var(--accent); }

.alert {
  padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; display: none;
  font-size: 14px; font-weight: 500;
}
.alert.show { display: block; }
.alert-success { background: rgba(16,185,129,0.1); color: var(--success); border: 1px solid var(--success); }
.alert-error { background: rgba(239,68,68,0.1); color: var(--error); border: 1px solid var(--error); }

@media (max-width: 480px) {
  .auth-container { padding: 30px 20px; }
}
</style>
</head>
<body>
<div class="auth-container">
  <div class="header">
    <div class="logo">⚡ YourApp</div>
    <button class="theme-btn" onclick="toggleTheme()">🌓</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Login</button>
    <button class="tab" onclick="switchTab('signup')">Sign Up</button>
  </div>

  <div class="alert" id="alert"></div>

  <!-- Login Form -->
  <form class="form active" id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required>
      <div class="error-msg" id="loginEmailError"></div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="password-wrapper">
        <input type="password" id="loginPassword" placeholder="Enter password" required>
        <button type="button" class="toggle-pass" onclick="togglePassword('loginPassword')">👁️</button>
      </div>
      <div class="error-msg" id="loginPasswordError"></div>
    </div>

    <div class="options">
      <label class="checkbox-group">
        <input type="checkbox" id="rememberMe"> Remember me
      </label>
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <button type="submit" class="btn">Login</button>
  </form>

  <!-- Signup Form -->
  <form class="form" id="signupForm" onsubmit="handleSignup(event)">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="signupName" placeholder="John Doe" required>
      <div class="error-msg" id="signupNameError"></div>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" required>
      <div class="error-msg" id="signupEmailError"></div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="password-wrapper">
        <input type="password" id="signupPassword" placeholder="Min 8 characters" required oninput="checkStrength()">
        <button type="button" class="toggle-pass" onclick="togglePassword('signupPassword')">👁️</button>
      </div>
      <div class="password-strength">
        <div class="strength-bar" id="strengthBar"></div>
      </div>
      <div class="error-msg" id="signupPasswordError"></div>
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
      <div class="error-msg" id="confirmPasswordError"></div>
    </div>

    <button type="submit" class="btn">Create Account</button>
  </form>

  <div class="divider"><span>OR</span></div>

  <div class="social-btns">
    <button class="social-btn" onclick="socialLogin('Google')">🔍</button>
    <button class="social-btn" onclick="socialLogin('GitHub')">💻</button>
    <button class="social-btn" onclick="socialLogin('Facebook')">📘</button>
  </div>
</div>

<script>
// Theme
function toggleTheme() {
  document.body.classList.toggle('light');
  localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
}
if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');

// Tab Switch
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
  
  event.target.classList.add('active');
  document.getElementById(tab + 'Form').classList.add('active');
  hideAlert();
}

// Password Toggle
function togglePassword(id) {
  const input = document.getElementById(id);
  input.type = input.type === 'password' ? 'text' : 'password';
}

// Password Strength
function checkStrength() {
  const pass = document.getElementById('signupPassword').value;
  const bar = document.getElementById('strengthBar');
  
  let strength = 0;
  if (pass.length >= 8) strength++;
  if (/[A-Z]/.test(pass) && /[a-z]/.test(pass)) strength++;
  if (/[0-9]/.test(pass) && /[^A-Za-z0-9]/.test(pass)) strength++;
  
  bar.className = 'strength-bar';
  if (strength === 1) bar.classList.add('strength-weak');
  else if (strength === 2) bar.classList.add('strength-medium');
  else if (strength === 3) bar.classList.add('strength-strong');
}

// Validation
function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function showError(inputId, message) {
  document.getElementById(inputId).classList.add('error');
  document.getElementById(inputId + 'Error').textContent = message;
  document.getElementById(inputId + 'Error').classList.add('show');
}

function clearErrors() {
  document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
  document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));
}

function showAlert(message, type) {
  const alert = document.getElementById('alert');
  alert.textContent = message;
  alert.className = `alert alert-${type} show`;
  setTimeout(() => hideAlert(), 4000);
}

function hideAlert() {
  document.getElementById('alert').classList.remove('show');
}

// Login Handler
function handleLogin(e) {
  e.preventDefault();
  clearErrors();
  
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  let valid = true;
  
  if (!validateEmail(email)) {
    showError('loginEmail', 'Invalid email format');
    valid = false;
  }
  if (password.length < 6) {
    showError('loginPassword', 'Password must be 6+ characters');
    valid = false;
  }
  
  if (!valid) return;
  
  // Demo: Check localStorage
  const users = JSON.parse(localStorage.getItem('users') || '[]');
  const user = users.find(u => u.email === email && u.password === password);
  
  if (user) {
    showAlert('Login successful! Redirecting...', 'success');
    localStorage.setItem('currentUser', JSON.stringify(user));
    setTimeout(() => {
      window.location.href = 'dashboard.html'; // Apna dashboard page
    }, 1500);
  } else {
    showAlert('Invalid email or password', 'error');
  }
}

// Signup Handler
function handleSignup(e) {
  e.preventDefault();
  clearErrors();
  
  const name = document.getElementById('signupName').value;
  const email = document.getElementById('signupEmail').value;
  const password = document.getElementById('signupPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  let valid = true;
  
  if (name.length < 3) {
    showError('signupName', 'Name must be 3+ characters');
    valid = false;
  }
  if (!validateEmail(email)) {
    showError('signupEmail', 'Invalid email format');
    valid = false;
  }
  if (password.length < 8) {
    showError('signupPassword', 'Password must be 8+ characters');
    valid = false;
  }
  if (password !== confirm) {
    showError('confirmPassword', 'Passwords do not match');
    valid = false;
  }
  
  if (!valid) return;
  
  // Demo: Save to localStorage
  const users = JSON.parse(localStorage.getItem('users') || '[]');
  if (users.find(u => u.email === email)) {
    showAlert('Email already registered', 'error');
    return;
  }
  
  users.push({ name, email, password });
  localStorage.setItem('users', JSON.stringify(users));
  showAlert('Account created! Please login', 'success');
  
  setTimeout(() => {
    switchTab('login');
    document.getElementById('loginEmail').value = email;
  }, 1500);
}

function socialLogin(provider) {
  showAlert(`${provider} login coming soon!`, 'error');
}
</script>
</body>
</html>
